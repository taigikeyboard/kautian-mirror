<!doctype html>
<html lang="nan-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="台語辭典：教育部《臺灣台語常用詞辭典》搜尋。支援漢字、台羅、白話字、注音符號、方音符號。">
  <title>教典備援網站</title>
  <!-- social previews: crawlers don't run JS, so every page shares this home card -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="教典備援網站">
  <meta property="og:title" content="教典備援網站｜台語辭典">
  <meta property="og:description" content="台語辭典：教育部《臺灣台語常用詞辭典》搜尋。支援漢字、台羅、白話字、注音符號、方音符號。">
  <meta property="og:url" content="https://taigikeyboard.tw/kautian-mirror/">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:image" content="https://taigikeyboard.tw/kautian-mirror/og-image.png?v=3">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="教典備援網站｜台語辭典">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://taigikeyboard.tw/kautian-mirror/og-image.png?v=3">
  <script>
    // apply the display settings and sidebar state before first paint (see src/settings.js, src/sidebar.js)
    try {
      const root = document.documentElement;
      // temporary: builds before 外觀 moved into settings stored a pinned theme alone; remove once
      // returning readers have re-saved (settings.theme, applied below, overrides it)
      const legacyTheme = localStorage.getItem("theme");
      if (legacyTheme === "light" || legacyTheme === "dark") root.dataset.theme = legacyTheme;
      if (JSON.parse(localStorage.getItem("sidebar")) === "closed") root.dataset.sidebar = "closed";
      const settings = JSON.parse(localStorage.getItem("settings")) || {};
      for (const [name, value] of Object.entries(settings)) {
        if (typeof value === "string") root.dataset[name] = value;
      }
    } catch {}
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <button class="corner-button sidebar-toggle" type="button" aria-controls="sidebar" aria-label="側邊欄" title="側邊欄">
    <svg viewBox="0 0 20 20" aria-hidden="true">
      <rect x="2.75" y="4" width="14.5" height="12" rx="2.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M7.75 4v12" fill="none" stroke="currentColor" stroke-width="1.5"/>
    </svg>
  </button>
  <!-- left sidebar: docked on wide screens (src/sidebar.js slides it away); on narrow ones a popover,
       so outside click / Esc close it -->
  <aside id="sidebar" class="sidebar" popover aria-label="側邊欄">
    <div class="sidebar-close">
      <button class="corner-button" type="button" popovertarget="sidebar" popovertargetaction="hide" aria-label="關" title="關">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <!-- the markup's selected / checked values are the defaults (src/settings.js) -->
    <form id="settings" class="settings" aria-label="設定">
      <label class="setting">外觀
        <select name="theme">
          <option value="auto" selected>自動</option>
          <option value="light">淺色</option>
          <option value="dark">深色</option>
        </select>
      </label>
      <label class="setting">字型
        <select name="font">
          <option value="system">系統</option>
          <option value="openhuninn" selected>粉圓</option>
          <option value="iansui">芫荽</option>
          <option value="genyomin">源樣明體</option>
          <option value="genyogothic">源樣烏體</option>
        </select>
      </label>
      <label class="setting">白話字
        <input type="checkbox" name="poj" role="switch" checked>
      </label>
      <label class="setting">方音符號
        <input type="checkbox" name="tps" role="switch" checked>
      </label>
    </form>
    <!-- 收藏: filled by main.js, hidden while empty; below the settings so the list can grow -->
    <nav id="bookmarks" class="bookmarks" aria-label="收藏" hidden></nav>
  </aside>
  <header class="masthead">
    <h1><a class="wordmark" href="./" data-nav>教典備援網站</a></h1>
    <form class="search" role="search" autocomplete="off">
      <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="7" cy="7" r="4.75" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <path d="M10.5 10.5l3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <input id="q" name="q" type="search" aria-label="搜尋"
             spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="search">
      <div id="suggest" class="suggest" role="listbox" aria-label="建議" hidden></div>
    </form>
  </header>

  <main id="view" class="card" aria-live="polite"></main>

  <footer class="footer">
    <p>資料來源：教育部《<a href="https://sutian.moe.edu.tw/" rel="noopener">臺灣台語常用詞辭典</a>》，<a href="https://creativecommons.org/licenses/by-nd/3.0/tw/" rel="noopener">CC BY-ND 3.0 TW</a></p>
    <p>非官方網站</p>
    <p>&copy; 2026 Bîn-hiân · <a href="https://p.ecpay.com.tw/AA663DE" rel="noopener">贊助支持 ❤️</a></p>
  </footer>
</body>
</html>
