<!doctype html>
<html lang="nan-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="教育部《臺灣台語常用詞辭典》搜尋。支援漢字、台羅、白話字、注音符號、方音符號。">
  <title>教典鬥搜揣｜非官方教典備份網站</title>
  <script>
    // apply a pinned theme before first paint (see src/theme.js)
    try {
      const theme = localStorage.getItem("theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="切換深淺色模式" title="切換深淺色模式">
    <svg class="icon-moon" viewBox="0 0 20 20" aria-hidden="true">
      <path d="M16.5 12.2A7 7 0 0 1 7.8 3.5a7 7 0 1 0 8.7 8.7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    </svg>
    <svg class="icon-sun" viewBox="0 0 20 20" aria-hidden="true">
      <circle cx="10" cy="10" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M10 1.75v2M10 16.25v2M1.75 10h2M16.25 10h2M4.17 4.17l1.41 1.41M14.42 14.42l1.41 1.41M4.17 15.83l1.41-1.41M14.42 5.58l1.41-1.41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>
  <header class="masthead">
    <h1><a class="wordmark" href="./" data-nav>教典鬥搜揣｜非官方教典備份網站</a></h1>
    <form class="search" role="search" autocomplete="off">
      <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="7" cy="7" r="4.75" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <path d="M10.5 10.5l3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <input id="q" name="q" type="search" aria-label="搜尋"
             spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="search">
      <div id="suggest" class="suggest" role="listbox" aria-label="建議" hidden></div>
    </form>
  </header>

  <main id="view" class="card" aria-live="polite"></main>

  <footer class="footer">
    <p>資料來源：教育部《<a href="https://sutian.moe.edu.tw/" rel="noopener">臺灣台語常用詞辭典</a>》，<a href="https://creativecommons.org/licenses/by-nd/3.0/tw/" rel="noopener">CC BY-ND 3.0 TW</a>。非官方網站。</p>
    <p>&copy; 2026 Bîn-hiân · <a href="https://p.ecpay.com.tw/AA663DE" rel="noopener">贊助支持 ❤️</a></p>
  </footer>
</body>
</html>
