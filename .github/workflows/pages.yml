name: pages

on:
  push:
    branches: [main]
    # extension-only files (shared code under extension/src and extension/scripts still deploys)
    paths-ignore:
      - "extension/manifest.json"
      - "extension/icons/**"
      - "extension/options/**"
      - "extension/store-assets/**"
      - "extension/*.md"
  workflow_dispatch:
  schedule:
    # Daily at 09:00 Asia/Taipei (01:00 UTC).
    - cron: "0 1 * * *"

permissions:
  contents: read

# one deploy at a time; never cancel a deploy that is already publishing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.upstream.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Check and fetch changed upstream inputs
        id: upstream
        run: node scripts/fetch-upstream.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_UNCHANGED: ${{ github.event_name == 'schedule' }}

      # same submodule as `make init`, without its local git-hook setup
      - name: Init submodule
        if: steps.upstream.outputs.deploy == 'true'
        run: git submodule update --init vendor/taigi-converter

      - run: npm ci
        if: steps.upstream.outputs.deploy == 'true'

      # keyed on the pinned zip hash only, so script edits don't re-download 300 MB
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.upstream.outputs.deploy == 'true'
        with:
          path: .cache/sutiau-mp3.zip
          key: sutiau-mp3-zip-${{ hashFiles('scripts/sutiau-mp3.sha256') }}

      # audio first: build:entries flags entries whose mp3 exists in dist/audio/
      - run: npm run build:audio
        if: steps.upstream.outputs.deploy == 'true'
      - run: npm run build
        if: steps.upstream.outputs.deploy == 'true'
        env:
          UPSTREAM_FETCHED: "true"
      - run: npm test
        if: steps.upstream.outputs.deploy == 'true'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.upstream.outputs.deploy == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
